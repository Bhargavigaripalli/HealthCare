 <!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Stackly Healthcare</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      overflow-x:hidden;

      background:
      linear-gradient(rgba(15,23,42,0.88), rgba(15,23,42,0.88)),
      url('./images/image6.webp');

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    /* BACK BUTTON */

    .back-home{
      position:fixed;
      top:20px;
      left:20px;

      padding:12px 20px;

      border-radius:40px;

      background:linear-gradient(135deg,#0ea5e9,#38bdf8);

      color:white;

      text-decoration:none;

      font-weight:600;

      transition:0.3s ease;

      z-index:1000;
    }

    .back-home:hover{
      transform:translateY(-3px);
    }

    /* MAIN CONTAINER */

    .auth-container{

      width:100%;
      max-width:1100px;

      display:grid;
      grid-template-columns:1fr 1fr;

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(18px);

      border-radius:30px;

      overflow:hidden;

      border:1px solid rgba(255,255,255,0.1);

      box-shadow:0 25px 60px rgba(0,0,0,0.4);
    }

    /* IMAGE */

    .auth-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* FORM SECTION */

    .auth-form-section{

      padding:45px;

      color:white;

      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .auth-form-section h1{
      font-size:42px;
      margin-bottom:10px;
    }

    .auth-form-section p{
      color:#cbd5e1;
      margin-bottom:20px;
      line-height:1.6;
    }

    /* INPUT GRID */

    .input-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    /* INPUTS */

    form input,
    form select{

      width:100%;

      padding:14px 16px;

      margin-bottom:14px;

      border-radius:12px;

      border:none;

      outline:none;

      background:rgba(255,255,255,0.08);

      color:white;

      border:1px solid transparent;

      transition:0.3s ease;
    }

    form input::placeholder{
      color:#cbd5e1;
    }

    form input:focus,
    form select:focus{
      border:1px solid #38bdf8;
      box-shadow:0 0 10px rgba(56,189,248,0.2);
    }

    form select option{
      background:#0f172a;
      color:white;
    }

    /* TERMS */

    .terms{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:14px;
      color:#cbd5e1;
      margin-bottom:15px;
    }

    .terms input{
      width:auto;
      margin-bottom:0;
    }

    /* ERROR */

    #passwordError,
    #nameError{

      color:#ff6b6b;

      font-size:13px;

      margin-bottom:10px;

      display:none;
    }

    /* BUTTON */

    .auth-btn{

      width:100%;

      padding:15px;

      border:none;

      border-radius:12px;

      background:linear-gradient(135deg,#0ea5e9,#38bdf8);

      color:white;

      font-size:16px;

      font-weight:600;

      cursor:pointer;

      transition:0.3s ease;
    }

    .auth-btn:hover{
      transform:translateY(-3px);
    }

    /* LOGIN LINK */

    .auth-link{
      margin-top:18px;
      text-align:center;
      color:#cbd5e1;
    }

    .auth-link a{
      color:#38bdf8;
      text-decoration:none;
      font-weight:600;
    }

    /* ACCESSIBILITY */

    button:focus,
    a:focus,
    input:focus,
    select:focus{
      outline:2px solid #38bdf8;
      outline-offset:2px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:992px){

      body{
        align-items:flex-start;
      }

      .auth-container{
        grid-template-columns:1fr;
        margin-top:80px;
      }

      .auth-image{
        height:260px;
      }

      .auth-form-section{
        padding:35px 25px;
        text-align:center;
      }

      .input-grid{
        grid-template-columns:1fr;
      }

    }

    @media(max-width:480px){

      body{
        padding:10px;
      }

      .auth-image{
        height:180px;
      }

      .auth-form-section h1{
        font-size:28px;
      }

      form input,
      form select{
        padding:12px;
        font-size:14px;
      }

      .auth-btn{
        padding:13px;
      }

    }

    @media(max-width:360px){

      .auth-form-section{
        padding:25px 18px;
      }

      .back-home{
        font-size:13px;
        padding:10px 16px;
      }

    }

  </style>

</head>

<body>

  <!-- BACK BUTTON -->

  <a href="index.html" class="back-home">

    ← Back to Home

  </a>

  <!-- MAIN CONTAINER -->

  <div class="auth-container">

    <!-- IMAGE -->

    <div class="auth-image">

      <img src="./images/image6.webp" alt="Healthcare Registration">

    </div>

    <!-- FORM -->

    <div class="auth-form-section">

      <h1>Create Account</h1>

      <p>
        Create your Stackly Healthcare account and start managing healthcare services.
      </p>

      <form id="registerForm">

        <!-- NAME INPUTS -->

        <div class="input-grid">

          <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="First Name"
          pattern="[A-Za-z ]+"
          title="Only alphabets allowed"
          required>

          <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="Last Name"
          pattern="[A-Za-z ]+"
          title="Only alphabets allowed"
          required>

        </div>

        <p id="nameError">
          Only alphabets are allowed in name fields
        </p>

        <!-- EMAIL -->

        <input
        type="email"
        id="email"
        name="email"
        placeholder="Email Address"
        autocomplete="email"
        required>

        <!-- ROLE -->

        <select
        id="role"
        name="role"
        required>

          <option value="" disabled selected>

            Select Role

          </option>

          <option>Admin</option>

          <option>Doctor</option>

          <option>Patient</option>

        </select>

        <!-- PASSWORD -->

        <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        autocomplete="new-password"
        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).{8,}"
        title="Password must contain uppercase, lowercase, number, special character and minimum 8 characters"
        required>

        <!-- CONFIRM PASSWORD -->

        <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm Password"
        autocomplete="new-password"
        required>

        <!-- PASSWORD ERROR -->

        <p id="passwordError">

          Passwords do not match

        </p>

        <!-- TERMS -->

        <label class="terms">

          <input
          type="checkbox"
          id="terms"
          name="terms"
          required>

          I agree to Terms & Conditions

        </label>

        <!-- BUTTON -->

        <button type="submit" class="auth-btn">

          Create Account

        </button>

      </form>

      <!-- LOGIN LINK -->

      <div class="auth-link">

        Already have an account?

        <a href="login.html">

          Login

        </a>

      </div>

    </div>

  </div>

  <!-- SCRIPT -->

  <script>

    const form =
    document.getElementById("registerForm");

    const password =
    document.getElementById("password");

    const confirmPassword =
    document.getElementById("confirmPassword");

    const passwordError =
    document.getElementById("passwordError");

    const firstName =
    document.getElementById("firstName");

    const lastName =
    document.getElementById("lastName");

    const nameError =
    document.getElementById("nameError");

    form.addEventListener("submit", function(e){

      e.preventDefault();

      // NAME VALIDATION

      const namePattern = /^[A-Za-z ]+$/;

      if(
        !namePattern.test(firstName.value) ||
        !namePattern.test(lastName.value)
      ){

        nameError.style.display = "block";

        return;

      }

      nameError.style.display = "none";

      // PASSWORD MATCH

      if(password.value !== confirmPassword.value){

        passwordError.style.display = "block";

        return;

      }

      passwordError.style.display = "none";

      // SUCCESS

      alert("Account Created Successfully");

      window.location.href = "login.html";

    });

  </script>

</body>

</html>
