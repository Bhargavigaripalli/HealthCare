 <!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stackly Healthcare Login</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(rgba(15,23,42,0.88),
      rgba(15,23,42,0.88)),

      url('https://img.magnific.com/free-photo/flat-lay-health-still-life-arrangement-with-copy-space_23-2148854064.jpg');

      background-size:cover;
      background-position:center;

      padding:40px;

      overflow-x:hidden;
    }

    /* =========================
       BACK BUTTON
    ========================== */

    .back-home{

      position:absolute;

      top:25px;
      left:25px;

      padding:14px 28px;

      border-radius:40px;

      background:linear-gradient(135deg,#0ea5e9,#38bdf8);

      color:white;

      text-decoration:none;

      font-weight:600;

      transition:0.4s;

      box-shadow:0 10px 25px rgba(14,165,233,0.3);
    }

    .back-home:hover{

      transform:translateY(-5px);

      box-shadow:0 15px 30px rgba(14,165,233,0.5);
    }

    /* =========================
       MAIN CONTAINER
    ========================== */

    .auth-container{

      width:1150px;

      display:grid;

      grid-template-columns:1fr 1fr;

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(20px);

      border:1px solid rgba(255,255,255,0.1);

      border-radius:35px;

      overflow:hidden;

      box-shadow:0 25px 60px rgba(0,0,0,0.4);

      animation:fadeIn 1s ease;
    }

    /* =========================
       LEFT IMAGE
    ========================== */

    .auth-image{

      position:relative;

      overflow:hidden;
    }

    .auth-image img{

      width:100%;
      height:100%;

      object-fit:cover;

      transition:0.5s;
    }

    .auth-image:hover img{
      transform:scale(1.05);
    }

    /* =========================
       FORM SECTION
    ========================== */

    .auth-form-section{

      padding:70px 60px;

      color:white;
    }

    .auth-form-section h1{

      font-size:58px;

      margin-bottom:10px;
    }

    .auth-form-section p{

      color:#cbd5e1;

      margin-bottom:35px;

      line-height:1.8;
    }

    /* =========================
       FORM
    ========================== */

    form input,
    form select{

      width:100%;

      padding:18px 20px;

      margin-bottom:22px;

      border:none;

      border-radius:15px;

      background:rgba(255,255,255,0.08);

      color:white;

      font-size:15px;

      outline:none;

      transition:0.4s;

      border:1px solid transparent;

      appearance:none;
    }

    form input::placeholder{
      color:#cbd5e1;
    }

    form input:focus,
    form select:focus{

      border:1px solid #38bdf8;

      box-shadow:0 0 15px rgba(56,189,248,0.3);
    }

    /* SELECT OPTION COLOR */

    form select option{

      background:#0f172a;

      color:white;
    }

    form select:invalid{
      color:#cbd5e1;
    }

    /* =========================
       LOGIN BUTTON
    ========================== */

    .auth-btn{

      width:100%;

      padding:18px;

      border:none;

      border-radius:15px;

      background:
      linear-gradient(135deg,#0ea5e9,#38bdf8);

      color:white;

      font-size:18px;

      font-weight:600;

      cursor:pointer;

      transition:0.4s;

      box-shadow:0 12px 25px rgba(14,165,233,0.3);
    }

    .auth-btn:hover{

      transform:translateY(-5px);

      box-shadow:0 15px 30px rgba(14,165,233,0.5);
    }

    /* =========================
       CREATE ACCOUNT
    ========================== */

    .auth-link{

      margin-top:28px;

      text-align:center;

      color:#cbd5e1;
    }

    .auth-link a{

      color:#38bdf8;

      text-decoration:none;

      font-weight:600;
    }

    .auth-link a:hover{
      text-decoration:underline;
    }

    /* =========================
       DEMO BOX
    ========================== */

    .demo-box{

      margin-top:40px;

      padding:25px;

      border-radius:20px;

      background:rgba(255,255,255,0.05);

      border:1px solid rgba(255,255,255,0.1);
    }

    .demo-box h3{

      margin-bottom:15px;

      color:#38bdf8;
    }

    .demo-box p{

      margin-bottom:10px;

      color:#e2e8f0;

      line-height:1.7;
    }

    /* =========================
       ANIMATION
    ========================== */

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:992px){

      .auth-container{

        width:100%;

        grid-template-columns:1fr;
      }

      .auth-image{
        height:320px;
      }

      .auth-form-section{

        padding:45px 30px;
      }

      .auth-form-section h1{
        font-size:42px;
      }

    }

    @media(max-width:768px){

      body{
        padding:20px;
      }

      .auth-image{
        height:250px;
      }

      .auth-form-section{

        padding:35px 22px;
      }

      .auth-form-section h1{

        font-size:34px;
      }

      .back-home{

        top:15px;
        left:15px;

        padding:12px 20px;

        font-size:14px;
      }

    }

    @media(max-width:480px){

      body{
        padding:10px;
      }

      .auth-container{
        border-radius:20px;
      }

      .auth-image{
        height:200px;
      }

      .auth-form-section h1{
        font-size:28px;
      }

      .auth-form-section p{
        font-size:14px;
      }

      form input,
      form select{

        padding:15px;

        font-size:14px;
      }

      .auth-btn{

        padding:15px;

        font-size:16px;
      }

      .demo-box{
        padding:18px;
      }

    }

  </style>

</head>

<body>

  <!-- BACK BUTTON -->

  <a href="index.html" class="back-home">
    ← Back to Home
  </a>

  <!-- MAIN CONTAINER -->

  <div class="auth-container">

    <!-- LEFT IMAGE -->

    <div class="auth-image">

      <img src="https://img.magnific.com/free-photo/flat-lay-health-still-life-arrangement-with-copy-space_23-2148854064.jpg">

    </div>

    <!-- RIGHT SIDE -->

    <div class="auth-form-section">

      <h1>Login</h1>

      <p>
        Access your Stackly Healthcare dashboard
        securely with role-based authentication.
      </p>

      <!-- LOGIN FORM -->

      <form id="loginForm">

        <input
        type="email"
        id="email"
        placeholder="Email Address"
        required>

        <input
        type="password"
        id="password"
        placeholder="Password"
        required>

        <select id="role" required>

          <option value="" disabled selected>
            Select Role
          </option>

          <option value="admin">
            Admin
          </option>

          <option value="doctor">
            Doctor
          </option>

          <option value="patient">
            Patient
          </option>

        </select>

        <button type="submit" class="auth-btn">
          Login
        </button>

      </form>

      <!-- CREATE ACCOUNT -->

      <div class="auth-link">

        Don't have an account?

        <a href="register.html">
          Create Account
        </a>

      </div>

      <!-- DEMO BOX -->

      <div class="demo-box">

        <h3>Demo Access</h3>

        <p>
          <strong>Admin:</strong>
          admin@stackly.com
        </p>

        <p>
          <strong>Doctor:</strong>
          doctor@stackly.com
        </p>

        <p>
          <strong>Patient:</strong>
          patient@stackly.com
        </p>

      </div>

    </div>

  </div>

  <!-- SCRIPT -->

  <script>

    document
    .getElementById("loginForm")
    .addEventListener("submit", function(event){

      event.preventDefault();

      const email =
      document.getElementById("email").value;

      const password =
      document.getElementById("password").value;

      const role =
      document.getElementById("role").value;

      if(email === "" ||
         password === "" ||
         role === ""){

        alert("Please fill all fields");

        return;
      }

      // ADMIN LOGIN

      if(role === "admin"){

        window.location.href =
        "admin-dashboard.html";
      }

      // DOCTOR LOGIN

      else if(role === "doctor"){

        window.location.href =
        "doctor-dashboard.html";
      }

      // PATIENT LOGIN

      else if(role === "patient"){

        window.location.href =
        "patient-dashboard.html";
      }

      else{

        alert("Invalid Role");
      }

    });

  </script>

</body>
</html>
