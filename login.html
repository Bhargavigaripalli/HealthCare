 <!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stackly Healthcare Login</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(rgba(15,23,42,0.9),
      rgba(15,23,42,0.9)),

      url('https://img.magnific.com/free-photo/flat-lay-health-still-life-arrangement-with-copy-space_23-2148854064.jpg');

      background-size:cover;
      background-position:center;

      padding:40px;

      overflow:hidden;
    }

    /* BACK BUTTON */

    .back-home{

      position:absolute;
      top:30px;
      right:40px;

      padding:14px 28px;

      border-radius:40px;

      background:#0ea5e9;

      color:white;

      text-decoration:none;

      font-weight:600;

      transition:0.4s;
    }

    .back-home:hover{
      transform:translateY(-5px);
    }

    /* CONTAINER */

    .auth-container{

      width:1150px;

      display:grid;
      grid-template-columns:1fr 1fr;

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(20px);

      border:1px solid rgba(255,255,255,0.1);

      border-radius:35px;

      overflow:hidden;

      box-shadow:0 25px 60px rgba(0,0,0,0.35);

      animation:fadeIn 1s ease;
    }

    /* LEFT SIDE */

    .auth-image{
      position:relative;
      overflow:hidden;
    }

    .auth-image img{

      width:100%;
      height:100%;

      object-fit:cover;

      transition:0.5s;
    }

    .auth-image:hover img{
      transform:scale(1.05);
    }

    /* RIGHT SIDE */

    .auth-form-section{

      padding:70px 60px;

      color:white;
    }

    .auth-form-section h1{

      font-size:58px;

      margin-bottom:10px;
    }

    .auth-form-section p{

      color:#cbd5e1;

      margin-bottom:35px;

      font-size:16px;
    }

    /* INPUTS */

    form input,
    form select{

      width:100%;

      padding:18px 20px;

      margin-bottom:22px;

      border:none;

      border-radius:15px;

      background:rgba(255,255,255,0.08);

      color:white;

      font-size:15px;

      outline:none;

      transition:0.4s;

      border:1px solid transparent;
    }

    form input:focus,
    form select:focus{

      border:1px solid #38bdf8;

      box-shadow:0 0 15px rgba(56,189,248,0.3);
    }

    form input::placeholder{
      color:#cbd5e1;
    }

    /* BUTTON */

    .auth-btn{

      width:100%;

      padding:18px;

      border:none;

      border-radius:15px;

      background:linear-gradient(135deg,#0ea5e9,#38bdf8);

      color:white;

      font-size:18px;

      font-weight:600;

      cursor:pointer;

      transition:0.4s;

      box-shadow:0 12px 25px rgba(14,165,233,0.3);
    }

    .auth-btn:hover{

      transform:translateY(-5px);

      box-shadow:0 15px 30px rgba(14,165,233,0.5);
    }

    /* CREATE ACCOUNT */

    .auth-link{

      margin-top:28px;

      text-align:center;

      color:#cbd5e1;
    }

    .auth-link a{

      color:#38bdf8;

      text-decoration:none;

      font-weight:600;
    }

    /* DEMO BOX */

    .demo-box{

      margin-top:40px;

      padding:25px;

      border-radius:20px;

      background:rgba(255,255,255,0.05);

      border:1px solid rgba(255,255,255,0.1);
    }

    .demo-box h3{

      margin-bottom:15px;

      color:#38bdf8;
    }

    .demo-box p{

      margin-bottom:10px;

      color:#e2e8f0;
    }

    /* ANIMATION */

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    /* RESPONSIVE */

    @media(max-width:950px){

      .auth-container{
        grid-template-columns:1fr;
      }

      .auth-image{
        height:300px;
      }

      .auth-form-section{
        padding:45px 30px;
      }

      .auth-form-section h1{
        font-size:42px;
      }

      .back-home{
        top:20px;
        right:20px;
      }

    }

    /* =========================
   MOBILE RESPONSIVE
========================= */

@media screen and (max-width: 1024px){

  .auth-container{

    width:95%;

    grid-template-columns:1fr;

    border-radius:25px;
  }

  .auth-image{

    height:320px;
  }

  .auth-form-section{

    padding:50px 40px;
  }

}

/* TABLET */

@media screen and (max-width: 768px){

  body{

    padding:20px;

    overflow-y:auto;
  }

  .auth-container{

    width:100%;

    border-radius:22px;
  }

  .auth-image{

    height:260px;
  }

  .auth-form-section{

    padding:40px 25px;
  }

  .auth-form-section h1{

    font-size:40px;
  }

  .auth-form-section p{

    font-size:14px;
  }

  form input,
  form select{

    padding:16px;

    font-size:14px;
  }

  .auth-btn{

    padding:16px;

    font-size:16px;
  }

  .demo-box{

    padding:20px;
  }

  .back-home{

    top:15px;
    right:15px;

    padding:12px 20px;

    font-size:14px;
  }

}

/* MOBILE */

@media screen and (max-width: 480px){

  body{

    padding:12px;
  }

  .auth-container{

    border-radius:18px;
  }

  .auth-image{

    height:220px;
  }

  .auth-image img{

    object-fit:cover;
  }

  .auth-form-section{

    padding:30px 18px;
  }

  .auth-form-section h1{

    font-size:32px;

    margin-bottom:8px;
  }

  .auth-form-section p{

    font-size:13px;

    margin-bottom:25px;
  }

  form input,
  form select{

    padding:14px;

    margin-bottom:18px;

    border-radius:12px;

    font-size:13px;
  }

  .auth-btn{

    padding:15px;

    border-radius:12px;

    font-size:15px;
  }

  .auth-link{

    font-size:13px;
  }

  .demo-box{

    margin-top:25px;

    padding:18px;

    border-radius:15px;
  }

  .demo-box h3{

    font-size:18px;
  }

  .demo-box p{

    font-size:13px;

    line-height:1.6;
  }

  .back-home{

    position:fixed;

    top:10px;
    right:10px;

    padding:10px 16px;

    font-size:12px;

    z-index:999;
  }

}

  </style>

</head>

<body>

  <!-- BACK BUTTON -->

  <a href="index.html" class="back-home">

    ← Back to Home

  </a>

  <!-- MAIN CONTAINER -->

  <div class="auth-container">

    <!-- LEFT IMAGE -->

    <div class="auth-image">

      <img src="https://img.magnific.com/free-photo/flat-lay-health-still-life-arrangement-with-copy-space_23-2148854064.jpg">

    </div>

    <!-- RIGHT FORM -->

    <div class="auth-form-section">

      <h1>Login</h1>

      <p>
        Access your Stackly Healthcare dashboard
      </p>

      <form id="loginForm">

        <input
        type="email"
        id="email"
        placeholder="Email Address"
        required>

        <input
        type="password"
        id="password"
        placeholder="Password"
        required>

        <select id="role" required>

          <option value="">
            Select Role
          </option>

          <option value="admin">
            Admin
          </option>

          <option value="doctor">
            Doctor
          </option>

          <option value="patient">
            Patient
          </option>

        </select>

        <button type="submit" class="auth-btn">
          Login
        </button>

      </form>

      <!-- CREATE ACCOUNT -->

      <div class="auth-link">

        Don't have an account?

        <a href="register.html">
          Create Account
        </a>

      </div>

      <!-- DEMO BOX -->

      <div class="demo-box">

        <h3>Demo Access</h3>

        <p>
          <strong>Admin:</strong>
          admin@stackly.com
        </p>

        <p>
          <strong>Doctor:</strong>
          doctor@stackly.com
        </p>

        <p>
          <strong>Patient:</strong>
          patient@stackly.com
        </p>

      </div>

    </div>

  </div>

  <!-- SCRIPT -->

  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event){

        event.preventDefault();

        const email =
        document.getElementById("email").value;

        const password =
        document.getElementById("password").value;

        const role =
        document.getElementById("role").value;

        if(email === "" ||
           password === "" ||
           role === ""){

          alert("Please fill all fields");

          return;
        }

        // ADMIN

        if(role === "admin"){

          window.location.href =
          "admin-dashboard.html";
        }

        // DOCTOR

        else if(role === "doctor"){

          window.location.href =
          "doctor-dashboard.html";
        }

        // PATIENT

        else if(role === "patient"){

          window.location.href =
          "patient-dashboard.html";
        }

      });

  </script>

</body>
</html>
