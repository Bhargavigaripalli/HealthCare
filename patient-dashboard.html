<!DOCTYPE html>
  <title>Patient Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

  <div class="sidebar">

    <h2>Stackly</h2>

    <ul>
      <li>Dashboard</li>
      <li>Appointments</li>
      <li>Medical Reports</li>
      <li>Prescriptions</li>
      <li>Billing</li>
      <li>Settings</li>
    </ul>

  </div>

  <div class="dashboard-main">

    <div class="topbar">
      <h1>Patient Dashboard</h1>
      <button class="logout-btn">Logout</button>
    </div>

    <div class="dashboard-cards">

      <div class="dash-card">
        <h3>Appointments</h3>
        <h2>4</h2>
      </div>

      <div class="dash-card">
        <h3>Reports</h3>
        <h2>12</h2>
      </div>

      <div class="dash-card">
        <h3>Prescriptions</h3>
        <h2>8</h2>
      </div>

    </div>

    <div class="dashboard-table">

      <h2>Upcoming Appointment</h2>

      <table>

        <tr>
          <th>Doctor</th>
          <th>Date</th>
          <th>Time</th>
        </tr>

        <tr>
          <td>Dr. Sarah Johnson</td>
          <td>12 Aug 2026</td>
          <td>10:30 AM</td>
        </tr>

      </table>

    </div>

  </div>

</body>
</html>
